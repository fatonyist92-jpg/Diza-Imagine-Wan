<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diza Imagine</title><style>
*{box-sizing:border-box}body{margin:0;background:#070707;color:#f5f5f5;font-family:Inter,system-ui,sans-serif}main{max-width:760px;margin:auto;padding:28px 18px 60px}.brand{font-weight:750;font-size:20px;letter-spacing:-.4px;margin-bottom:28px}.panel{border:1px solid #242424;background:#0d0d0d;border-radius:18px;padding:16px}.drop{height:290px;border:1px dashed #383838;border-radius:14px;display:grid;place-items:center;overflow:hidden;background:#111;cursor:pointer}.drop img{width:100%;height:100%;object-fit:contain}.muted{color:#888;font-size:13px}textarea{width:100%;min-height:120px;margin-top:14px;background:#111;border:1px solid #2b2b2b;border-radius:14px;color:#fff;padding:14px;font:inherit;resize:vertical;outline:none}button{width:100%;height:52px;border:0;border-radius:14px;margin-top:12px;background:#fff;color:#050505;font-weight:750;font-size:15px;cursor:pointer}button:disabled{opacity:.45}.status{min-height:22px;margin:14px 2px 0;color:#aaa;font-size:13px}.progress{height:6px;background:#1d1d1d;border-radius:99px;overflow:hidden;margin-top:10px;display:none}.progress>i{display:block;height:100%;width:0;background:#fff;border-radius:99px;transition:width .35s ease}.progress.on{display:block}.result{margin-top:16px}.result video{width:100%;border-radius:14px;background:#000;max-height:70vh}.row{display:flex;justify-content:space-between;align-items:center;margin-top:10px}.pill{font-size:11px;color:#aaa;border:1px solid #292929;border-radius:99px;padding:5px 8px}
</style></head><body><main><div class="brand">DIZA IMAGINE <span class="pill">WAN 2.2 · I2V</span></div><div class="panel">
<label class="drop" id="drop"><span id="hint"><b>Upload image</b><br><span class="muted">JPG / PNG / WEBP</span></span><img id="preview" hidden></label><input id="file" type="file" accept="image/*" hidden>
<textarea id="prompt" placeholder="Describe the motion..."></textarea><button id="go">Generate video</button><div class="progress" id="progress"><i id="bar"></i></div><div class="status" id="status"></div><div class="result" id="result"></div>
</div><div class="muted" style="text-align:center;margin-top:12px">DIRECT-HF-V2</div></main><script type="module">
import { Client, handle_file } from "https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js";

const file=document.querySelector('#file'),drop=document.querySelector('#drop'),preview=document.querySelector('#preview'),hint=document.querySelector('#hint'),go=document.querySelector('#go'),status=document.querySelector('#status'),result=document.querySelector('#result'),progress=document.querySelector('#progress'),bar=document.querySelector('#bar');
const prog=(n,t)=>{progress.classList.add('on');bar.style.width=Math.max(0,Math.min(100,n))+'%';status.textContent=n+'% · '+t};
drop.onclick=()=>file.click();
file.onchange=()=>{if(!file.files[0])return;preview.src=URL.createObjectURL(file.files[0]);preview.hidden=false;hint.hidden=true};

go.onclick=async()=>{
 const p=document.querySelector('#prompt').value.trim();
 if(!file.files[0]||!p){status.textContent='Upload image dan isi prompt dulu.';return}
 go.disabled=true;result.innerHTML='';prog(5,'Connecting to Wan 2.2…');
 const negative='色调艳丽, 过曝, 静态, 细节模糊不清, 字幕, 最差质量, 低质量, JPEG压缩残留, 畸形的, 静止不动的画面';
 try{
   const app=await Client.connect("https://zerogpu-aoti-wan2-2-fp8da-aoti-faster.hf.space",{events:["status","data"]});
   prog(15,'Submitting to ZeroGPU…');
   const job=app.submit("/generate_video",[
     handle_file(file.files[0]),
     p,
     6,
     negative,
     5,
     1,
     1,
     42,
     true
   ]);
   let payload=null;
   for await (const msg of job){
     if(msg.type==="status"){
       const s=msg.stage||msg.status||msg.code||"pending";
       if(s==="generating") prog(65,'Wan generating video…');
       else if(s==="complete") prog(90,'Finalizing MP4…');
       else if(s==="error") throw Error(msg.message||msg.code||'ZeroGPU generation error');
       else {
         const pos=msg.position??msg.rank;
         prog(30,pos!=null?'Wan GPU queue · position '+pos:'Wan GPU queue…');
       }
     }
     if(msg.type==="data" && msg.data) payload=msg.data;
   }
   if(!payload) throw Error('Wan completed without video data');
   let v=null;
   const walk=o=>{if(v)return;if(typeof o==='string'&&/\.(mp4|webm)(\?|$)/i.test(o))v=o;else if(o&&typeof o==='object'){if(typeof o.url==='string'&&/\.(mp4|webm)(\?|$)/i.test(o.url))v=o.url;else Object.values(o).forEach(walk)}};
   walk(payload);
   if(!v) throw Error('No MP4 URL returned: '+JSON.stringify(payload).slice(0,300));
   result.innerHTML='<video controls autoplay loop playsinline src="'+v+'"></video><div class="row"><span class="muted">MP4 ready</span><a class="pill" style="color:#fff;text-decoration:none" target="_blank" href="'+v+'">Open MP4</a></div>';
   prog(100,'MP4 ready ✓');
 }catch(e){
   const msg=(e&&e.message)?e.message:String(e||'unknown error');
   status.textContent='Wan failed: '+msg.slice(0,500);progress.classList.remove('on');
 }finally{go.disabled=false}
};
</script></body></html>
