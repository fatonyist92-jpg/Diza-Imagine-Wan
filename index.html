<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diza Imagine</title><style>
*{box-sizing:border-box}body{margin:0;background:#070707;color:#f5f5f5;font-family:Inter,system-ui,sans-serif}main{max-width:760px;margin:auto;padding:28px 18px 60px}.brand{font-weight:750;font-size:20px;letter-spacing:-.4px;margin-bottom:28px}.panel{border:1px solid #242424;background:#0d0d0d;border-radius:18px;padding:16px}.drop{height:290px;border:1px dashed #383838;border-radius:14px;display:grid;place-items:center;overflow:hidden;background:#111;cursor:pointer}.drop img{width:100%;height:100%;object-fit:contain}.muted{color:#888;font-size:13px}textarea{width:100%;min-height:120px;margin-top:14px;background:#111;border:1px solid #2b2b2b;border-radius:14px;color:#fff;padding:14px;font:inherit;resize:vertical;outline:none}button{width:100%;height:52px;border:0;border-radius:14px;margin-top:12px;background:#fff;color:#050505;font-weight:750;font-size:15px;cursor:pointer}button:disabled{opacity:.45}.status{min-height:22px;margin:14px 2px 0;color:#aaa;font-size:13px}.progress{height:6px;background:#1d1d1d;border-radius:99px;overflow:hidden;margin-top:10px;display:none}.progress>i{display:block;height:100%;width:0;background:#fff;border-radius:99px;transition:width .35s ease}.progress.on{display:block}.result{margin-top:16px}.result video{width:100%;border-radius:14px;background:#000;max-height:70vh}.row{display:flex;justify-content:space-between;align-items:center;margin-top:10px}.pill{font-size:11px;color:#aaa;border:1px solid #292929;border-radius:99px;padding:5px 8px}
</style></head><body><main><div class="brand">DIZA IMAGINE <span class="pill">WAN 2.2 · I2V</span></div><div class="panel">
<label class="drop" id="drop"><span id="hint"><b>Upload image</b><br><span class="muted">JPG / PNG / WEBP</span></span><img id="preview" hidden></label><input id="file" type="file" accept="image/*" hidden>
<textarea id="prompt" placeholder="Describe the motion..."></textarea><button id="go">Generate video</button><div class="progress" id="progress"><i id="bar"></i></div><div class="status" id="status"></div><div class="result" id="result"></div>
</div></main><script type="module">
import { Client, handle_file } from "https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js";
const file=document.querySelector('#file'),drop=document.querySelector('#drop'),preview=document.querySelector('#preview'),hint=document.querySelector('#hint'),go=document.querySelector('#go'),status=document.querySelector('#status'),result=document.querySelector('#result'),progress=document.querySelector('#progress'),bar=document.querySelector('#bar');const prog=(n,t)=>{progress.classList.add('on');bar.style.width=Math.max(0,Math.min(100,n))+'%';status.textContent=n+'% · '+t};
drop.onclick=()=>file.click();file.onchange=()=>{if(!file.files[0])return;preview.src=URL.createObjectURL(file.files[0]);preview.hidden=false;hint.hidden=true}
go.onclick=async()=>{const p=document.querySelector('#prompt').value.trim();if(!file.files[0]||!p){status.textContent='Upload image dan isi prompt dulu.';return}go.disabled=true;result.innerHTML='';prog(5,'Connecting Wan 2.2…');
try{const providers=["zerogpu-aoti/wan2-2-fp8da-aoti-faster","r3gm/wan2-2-fp8da-aoti","Saravutw/WAN2.2-I2V-LIGHTNING-Video-4-8step"];prog(10,'Selecting Wan provider…');const negative='色调艳丽, 过曝, 静态, 细节模糊不清, 字幕, 最差质量, 低质量, JPEG压缩残留, 畸形的, 静止不动的画面';let r=null,lastErr=null;for(let i=0;i<providers.length&&!r;i++){try{prog(15+i*5,'Connecting provider '+(i+1)+'/'+providers.length+'…');const app=await Promise.race([Client.connect(providers[i]),new Promise((_,rej)=>setTimeout(()=>rej(Error('connect timeout')),15000))]);const job=app.submit('/generate_video',[handle_file(file.files[0]),p,6,negative,5,1,1,42,true]);for await(const msg of job){if(msg.type==='status'){const q=msg.position!=null?' · queue '+(msg.position+1):'';prog(30+i*5,'Provider '+(i+1)+' GPU queue'+q)}else if(msg.type==='data'){prog(90,'Processing MP4…');r={data:msg.data};break}}}catch(e){lastErr=e;prog(20+i*8,'Provider '+(i+1)+' unavailable, switching…')}}if(!r)throw Error('All Wan providers unavailable'+(lastErr?': '+(lastErr.message||lastErr):''));let x=r.data;let v=null;const walk=o=>{if(v)return;if(typeof o==='string'&&/\.(mp4|webm)(\?|$)/i.test(o))v=o;else if(o&&typeof o==='object'){if(o.url)v=o.url;else if(o.path&&/^https?:/.test(o.path))v=o.path;else Object.values(o).forEach(walk)}};walk(x);if(!v)throw Error('No video URL returned');result.innerHTML='<video controls autoplay loop playsinline src="'+v+'"></video><div class="row"><span class="muted">MP4 ready</span><a class="pill" style="color:#fff;text-decoration:none" target="_blank" href="'+v+'">Open MP4</a></div>';prog(100,'MP4 ready ✓')}catch(e){status.textContent='Generation failed: '+String(e.message||e).slice(0,220)}finally{go.disabled=false;if(!result.innerHTML)setTimeout(()=>progress.classList.remove('on'),1200)}}
</script></body></html>
